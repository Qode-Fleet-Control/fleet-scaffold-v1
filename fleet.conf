# fleet.conf — app manifest. Sourced (as shell) by the lifecycle scripts
# (bin/run bin/start bin/restart bin/reload bin/stop). `$PORT` is available inside every
# command. Leave a command empty ('') to skip that step.

NAME="fleet-scaffold"
PORT="5000"                  # default port; the fleet overrides via injected $PORT
HEALTH_PATH="/api/health"    # the API answers 200 here once it is up

# --- process runtime: local work without docker (`FLEET_RUNTIME=process bin/run`) ---
# SINGLE-QUOTE any command that uses $PORT, so it expands when the command RUNS.
# Needs DATABASE_URL; db:push syncs the schema first, as the image's entrypoint does.
INSTALL_CMD='npm ci --no-audit --no-fund'
BUILD_CMD='npm run build'
START_CMD='[ -n "$DATABASE_URL" ] || { echo "ERROR: DATABASE_URL is not set — this app needs a Postgres database" >&2; exit 1; }; npm run db:push && cd apps/api && exec node dist/index.cjs'
RELOAD_CMD=''

# --- docker runtime (compose.yaml) ---------------------------------------------
# How the fleet runs the app: as containers, in the coordinator's private docker. These
# REPLACE the commands above, which are only for local work without docker
# (`FLEET_RUNTIME=process bin/run`). START runs compose in the FOREGROUND so the fleet's
# stop can end it. See bin/_common.sh.
DOCKER_BUILD_CMD='docker compose build'
DOCKER_START_CMD='docker compose up --remove-orphans'
DOCKER_RELOAD_CMD=''
