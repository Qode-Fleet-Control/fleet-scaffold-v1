# Fleet run manifest — sourced by bin/_common.sh and by the fleet's QA tester.
# The fleet injects PORT, BASE_PATH and DATABASE_URL; they win over values here.
# Commands run from the repo root (tester) or from bin/ (bin/run), hence FLEET_ROOT.
# Keep $PORT / $BASE_PATH single-quoted so they expand when the command runs.
NAME="fleet-clms"
PORT="5000"
HEALTH_PATH="/api/healthz"
# Private GitHub Packages: the token variable named in .npmrc must be set in the App .env.
INSTALL_CMD='cd "${FLEET_ROOT:-.}" && npm ci --no-audit --no-fund'
# Bakes BASE_PATH into the web build, then syncs the schema into $DATABASE_URL.
BUILD_CMD='cd "${FLEET_ROOT:-.}" && BASE_PATH="$BASE_PATH" npm run build && npm run db:push'
# Production server in the foreground; node itself holds the pidfile's PID.
START_CMD='env PORT="$PORT" node --enable-source-maps "${FLEET_ROOT:-.}/apps/api/dist/index.mjs"'
RELOAD_CMD=''
