services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clms"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      secrets:
        - npm_token
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/clms
      PORT: "5000"
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      # CLMS is a controlled demonstration: its prototype persona sessions
      # (e.g. J-014, J-015) are only issued when NODE_ENV=development.
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

secrets:
  npm_token:
    environment: GITHUB_TOKEN   # the variable the repo's .npmrc references

volumes:
  pgdata:
