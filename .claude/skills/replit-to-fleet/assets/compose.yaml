# compose.yaml — the app as containers: the fleet's docker runtime (fleet.conf DOCKER_*).
# On the fleet: $PORT is published as ${PORT}:${PORT} (the coordinator forwards the app URL
# to it) and the workspace's DATABASE_URL etc. are passed through by name — the fleet
# attaches its services to the private docker under the hostnames those URLs use.
# Locally: `docker compose --profile local up --build` adds a Postgres (the `local` profile).
services:
  app:
    build:
      context: .
      secrets:
        - npm_token
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      PORT: ${PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@db:5432/clms}
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      # CLMS is a controlled demonstration: its prototype persona sessions
      # (e.g. J-014, J-015) are only issued when NODE_ENV=development.
      NODE_ENV: ${NODE_ENV:-development}
      # from the fleet, passed through unchanged
      FLEET_APP_HOST:
      FLEET_APP_URL:
      REDIS_URL:
      S3_ENDPOINT:
      S3_BUCKET:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_REGION:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_URL:

  # Local development only: a Postgres the fleet's DATABASE_URL replaces in Fleet Control.
  db:
    profiles: ["local"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clms
    volumes:
      - pgdata:/var/lib/postgresql/data

secrets:
  npm_token:
    environment: GITHUB_TOKEN   # the variable the repo's .npmrc references

volumes:
  pgdata:
